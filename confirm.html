<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Reservations | ShopEase</title>
 <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      referrerpolicy="no-referrer"
    />
</head>

<body class="min-h-screen bg-[#f0f1f3] text-black">
  <header class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-5 py-6 sm:px-10">
    <a href="./index.html" class="text-3xl font-black sm:text-4xl">
      Shop<span class="text-blue-500">Ease</span>
    </a>
    <a href="./index.html" class="text-sm font-semibold text-blue-600 hover:underline">
      Back to products
    </a>
  </header>

  <main class="mx-auto max-w-7xl px-5 pb-12 pt-4 sm:px-10">
    <p class="font-semibold text-blue-600">Your account</p>
    <h1 class="mt-2 text-4xl font-black tracking-tight sm:text-6xl">
      My Reservations
    </h1>
    <p class="mt-3 text-slate-600">
      Find a reservation by email and filter by status.
    </p>

    <section 
             class="mt-8 rounded-2xl border border-slate-200 bg-white p-5 sm:p-6">
      <h2 id="filters-title" class="text-xl font-bold">Find a reservation</h2>

      <div class="mt-4 flex flex-col gap-4 sm:flex-row">
        <div class="flex-1">
          <label for="reservation-email" class="mb-1 block font-semibold">
            Customer email
          </label>
          <input
            id="reservation-email"
            type="search"
            placeholder="Enter the full email"
            class="w-full rounded-xl border border-slate-300 bg-slate-100 px-4 py-3"
          />
        </div>

        <div class="sm:w-56">
          <label for="reservation-status" class="mb-1 block font-semibold">
            Status
          </label>
          <select id="reservation-status"
                  class="w-full rounded-xl border border-slate-300 bg-slate-100 px-4 py-3">
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>
    </section>




    <p id="reservation-count" class="mt-6 font-semibold" aria-live="polite"></p>

    <section id="reservations-list" aria-label="Reservations"
             class="mt-4 flex flex-col gap-5">


    </section>

    <p id="no-reservations"
       class="mt-4 hidden rounded-xl border border-slate-200 bg-white p-5 text-slate-600">
      No reservations match your search.
    </p>
  </main>


</body>

    <script type="module" src="./js/pages/reservations-page.js"></script>
</html>
