<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopEase - Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="bg-gray-100">
    <header class="m-6 px-10 flex items-center justify-between">
      <div class="text-4xl font-bold">
        Shop<span class="text-blue-500">Ease</span>
      </div>
      <button class="text-blue-500 font-bold text-4xl hover:text-blue-800">
        <i class="fa-solid fa-cart-shopping"></i>
      </button>
    </header>

    <main class="px-5">
      <div class="flex flex-col gap-2">
        <p class="text-blue-500 font-bold">Our collection</p>
        <h1 class="font-black text-6xl">Explore Our Products</h1>
        <p class="text-2xl">Discover products that match your needs.</p>
      </div>

      <div
        class="m-5 mt-12 border rounded-xl p-10 bg-white flex flex-col flex-wrap gap-2"
      >
        <h5 class="text-xl font-bold">Find what you need</h5>
        <p class="text-gray-500">
          Search and combine filters to narrow your selection.
        </p>
        <div class="flex justify-between items-center mt-8 gap-4 flex-wrap">
          <div class="flex flex-col">
            <label class="font-bold" for="search-input">Search products</label>
            <input
              class="bg-gray-200 border border-black/10 p-4 rounded-xl"
              type="search" id="search-input"
            />
          </div>
          <div class="flex flex-col">
            <label class="font-bold" for="category-select">Category</label>
            <select
              class="bg-gray-200 border border-black/10 p-4 rounded-xl"
              id="category-select"
            >
              <option value="">All Categories</option>
            </select>
          </div>

          <div class="flex flex-col">
            <label class="font-bold" for="stock-select">Stock</label>
            <select
              class="bg-gray-200 border border-black/10 p-4 rounded-xl"
              id="stock-select"
            >
              <option value="">All Stock</option>
              <option value="true">In Stock</option>
              <option value="false">Out of Stock</option>
            </select>
          </div>
          <div class="flex flex-col gap-2">
            <label class="font-bold" for="maxPrice-input">Price</label>
            <div>
              <label class="font-bold" for="maxPrice-input">Max</label>
              <input
                class="bg-gray-200 border border-black/10 p-2 rounded-xl"
                type="number"
                name=""
                id="maxPrice-input"
              />
            </div>
            <div>
              <label class="font-bold" for="minPrice-input">Min</label>
              <input
                class="bg-gray-200 border border-black/10 p-2 rounded-xl"
                type="number"
                name=""
                id="minPrice-input"
              />
            </div>
          </div>
        </div>
      </div>
      <div class="ml-6 mb-5">
        <p class="text-blue-500 font-bold m-5">Product catalog</p>
        <h5 id="products-count" class="text-xl font-bold">
          Showing 0 products
        </h5>
      </div>

      <div id="products-contonair" class="flex flex-wrap gap-4"></div>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
